name: CI

# R1 iron law: the golden datasets are the acceptance test, and they must run on
# every change. They need no Java and no GL — the datasets and the shipped
# configuration are both in the repository.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm is pinned here and ONLY here. `package.json` must not carry a
      # `"packageManager"` field at the same time: pnpm/action-setup@v4 fails hard
      # when it sees both ("Multiple versions of pnpm specified" →
      # ERR_PNPM_BAD_PM_VERSION). That is exactly how this workflow was broken
      # before the Java exit — the job died at this step and never reached
      # `pnpm install`, so nothing downstream had ever actually run.
      # Bump this together with `pnpm install` locally; `engines.node` in
      # package.json is the other half of the toolchain pin.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (dependency direction + bare strings)
        run: pnpm lint

      - name: Unit tests + golden datasets (full)
        run: pnpm test
        env:
          NCPL_GOLDEN: full

      # R1.0d + java-exit-plan §P2/P4: the port audit must stay reproducible. CI replays the
      # checked-in snapshot (`--baseline`) and asserts its contentSha256, so the gate keeps working
      # after the Java tree is deleted — a missing/edited snapshot fails instead of printing
      # `files=0`. To re-scan a tree (`git checkout java-frozen-<sha> -- src`), use `--summary`,
      # which compares the scanned hash against the same pinned EXPECTED_SHA.
      - name: Port audit (deterministic)
        run: node tools/ts/port-audit.mjs --baseline docs/r1/port-audit-file-level.json

      # R2: docs/r2/fixture-coverage.md is a checked-in report. Regenerating it
      # from the manifest and the TS reader chain must be a no-op, otherwise the
      # table has drifted from the code it claims to describe. (Compared against a
      # copy rather than `git diff`, so the check works regardless of index state.)
      - name: R2 fixture coverage table is up to date
        run: |
          cp docs/r2/fixture-coverage.md "$RUNNER_TEMP/coverage.md"
          pnpm r2:coverage
          diff -u "$RUNNER_TEMP/coverage.md" docs/r2/fixture-coverage.md

      # java-exit-plan §P5: the Java tree stays archived in tag java-frozen-<sha>.
      # Nothing may re-introduce a `*.java` / `*.jar`, and the tracked tree must stay
      # under 60 MB — both are what the exit plan actually delivered (205.5 → ~50 MB).
      - name: No Java in the tree (§P5)
        run: pnpm check:no-java

      - name: Tracked repository size (§P5)
        run: pnpm size:repo

      # R3.8 + §11.3: no key the UI asks for may be missing from a shipped pack
      # (a key that resolves through the fallback chain is a missing translation).
      - name: App i18n coverage (§11.3)
        run: pnpm i18n:audit

      # R3.1 + plan §11.3: the app must build, and its static assets (minus the
      # inlined configuration datasets) must stay under 15 MB.
      - name: Build the web app
        run: pnpm build:app

      - name: Build size budget (§11.3)
        run: pnpm size
