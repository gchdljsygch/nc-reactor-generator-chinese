plugins {
    id 'java'
    id 'application'
}

group = 'net.ncplanner'
version = 'DEV'

def localJar = { String name -> file("libraries/${name}") }

// DizzyEngine is distributed as a local set of LWJGL and JOML jars. Keep
// native jars on the runtime classpath, but ignore source and javadoc jars.
def dizzyEngineLibraries = fileTree('libraries/DizzyEngine') {
    include '*.jar'
    exclude '*-sources.jar'
    exclude '*-javadoc.jar'
}

repositories {
    flatDir {
        dirs 'libraries', 'libraries/DizzyEngine'
    }
}

dependencies {
    implementation files(
        localJar('JDA-4.3.0_277-withDependencies-min.jar'),
        localJar('classgraph-4.8.184.jar'),
        localJar('dssl-4.2.jar'),
        localJar('javassist.jar'),
        localJar('reflections-0.10.2.jar')
    )
    implementation files(dizzyEngineLibraries)
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
    test {
        java.srcDirs = ['test']
    }
}

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

application {
    mainClass = 'net.ncplanner.plannerator.planner.Main'
}

tasks.named('run', JavaExec) {
    workingDir = projectDir
    standardInput = System.in
    args 'Skip Dependencies'
}

tasks.named('jar', Jar) {
    archiveFileName = 'NC-Plannerator-DEV.jar'
    manifest {
        attributes('Main-Class': 'net.ncplanner.plannerator.planner.Main')
    }
}
